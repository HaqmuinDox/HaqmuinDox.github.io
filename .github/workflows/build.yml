name: Build Writing Section

on:
  push:
    branches: [main]
    paths:
      - 'writing/_src/**'
      - 'writing/_template.html'
      - 'scripts/build.js'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build writing section
        run: node scripts/build.js

      - name: Commit built files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add writing/index.html writing/search.json writing/*.html index.html
          git diff --cached --quiet || git commit -m "chore: rebuild writing section [skip ci]"
          git push
